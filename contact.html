<!doctype html>
<html lang="en" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png"/>
    <title>İletişim - My Tech Lens</title>
  </head>
  <body class="h-100 d-flex flex-column">
    <!-- navbar -->
    <nav class="navbar navbar-expand-md navbar-dark">
      <div class="container">
        <a href="index.html" class="navbar-brand d-flex align-items-center py-0">
          <img src="img/favicon.png" alt="My Tech Lens" class="navbar-logo" style="height: 20px; max-height: 20px; width: auto;">
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mobile"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mobile" class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a href="index.html" class="nav-link">Anasayfa</a>
            </li>
            <li class="nav-item">
              <a href="blogs.html" class="nav-link">Yazılar</a>
            </li>
            <li class="nav-item">
              <a href="contact.html" class="nav-link active">İletişim</a>
            </li>
          </ul>
          <form class="d-flex mt-3 mt-md-0 mb-2 mb-md-0">
            <input type="text" class="form-control me-1" placeholder="Arayın..." />
            <button class="btn btn-search" type="submit">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </form>
        </div>
      </div>
    </nav>

    <!-- main -->
    <main>
      <div class="container my-4">
        <h2 class="my-3">Bana Ulaşın</h2>
        <div class="row g-4">
          <div class="col-md-6">
            <div class="card bg-dark border-0 shadow-sm h-100">
              <div class="card-body p-4">
                <div class="alert alert-custom">
                  <i class="fa-solid fa-circle-info me-2"></i>Lütfen Bu Formu Doldurun!
                </div>
                <form action="" class="row g-3 text-white">
                  <div class="col-md-6">
                    <label for="email" class="form-label">E-Posta:</label>
                    <input
                      type="email"
                      name="email"
                      id="email"
                      class="form-control"
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="name" class="form-label">Adınız:</label>
                    <input
                      type="text"
                      name="name"
                      id="name"
                      class="form-control"
                    />
                  </div>
                  <div class="col-md-12">
                    <label for="phone" class="form-label">Telefon:</label>
                    <input
                      type="tel"
                      name="phone"
                      id="phone"
                      class="form-control"
                    />
                  </div>
                  <div class="col-md-12">
                    <label for="subject" class="form-label">Konu:</label>
                    <input
                      type="text"
                      name="subject"
                      id="subject"
                      class="form-control"
                    />
                  </div>
                  <div class="col-md-12">
                    <label for="message" class="form-label">Mesaj:</label>
                    <textarea
                      name="message"
                      id="message"
                      class="form-control"
                      rows="4"
                    ></textarea>
                  </div>
                  <div class="col-md-12">
                    <button class="btn btn-contact w-100" type="submit">
                      <i class="fa-solid fa-paper-plane me-2"></i>Mesajı Gönder
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <div class="col-md-6 d-flex flex-column">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3059.7378474542793!2d32.83450367553677!3d39.924882471522906!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14d34f190a9cea8f%3A0xd3862ea8248d08a0!2sAn%C4%B1tkabir!5e0!3m2!1str!2str!4v1769355953824!5m2!1str!2str"
              id="map"
              width="100%"
              style="border: 0"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>
        </div>
      </div>
    </main>

    <!-- footer -->
    <footer class="py-5 bg-dark text-white mt-auto">
      <div class="container text-center">
        <span>Hakları Bende Saklıdır. @2026</span>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
